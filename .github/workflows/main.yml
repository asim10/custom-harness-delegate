name: CI

on:
  push:
    tags:
      - 'v*'   # triggers only when you push a tag like v1.0.0

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract version from Git tag
      - name: Extract version
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # Build image as tarball
      - name: Build Docker image (tarball)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/custom-harness-delegate:${{ github.ref_name }}

      # Install Trivy
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo cp ./bin/trivy /usr/local/bin/


      # Scan image with Trivy
      - name: Scan tarball with Trivy
        run: trivy image --input /tmp/image.tar --format sarif --output trivy-results.sarif

      # Upload the report so it's accessible
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # Push image if scan passes
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/custom-harness-delegate:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/custom-harness-delegate:${{ github.ref_name }}