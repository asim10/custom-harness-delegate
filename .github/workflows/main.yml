name: Build, Scan and Push Docker Image

on:
  push:
    tags:
      - 'v*'   # triggers only when you push a tag like v1.0.0

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract version from Git tag
      - name: Extract version
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # Build image with both tags (latest + version)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harness-delegate:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/harness-delegate:${{ env.VERSION }}

      # Scan image with Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/harness-delegate:${{ env.VERSION }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

      # Push image if scan passes
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harness-delegate:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/harness-delegate:${{ env.VERSION }}